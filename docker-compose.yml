# VajraTwin — local reproducible stack: frontend + backend + MongoDB.
# Usage:  docker compose up --build
#
# The backend connects to the mongodb service. If Mongo is unavailable the
# backend automatically falls back to in-memory DEMO MODE (it never crashes).

services:
  mongodb:
    image: mongo:7
    container_name: vajratwin-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - vajratwin_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: vajratwin-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB: "vajratwin"
      LOG_LEVEL: "INFO"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost"
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the backend on the host-published port.
        VITE_API_BASE_URL: "http://localhost:8000"
    container_name: vajratwin-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  vajratwin_mongo_data:
